<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #workspace-container {
            width: 100vw;
            height: 100vh;
            background-color: #2a2a2a;
            position: relative;
            cursor: grab;
        }

        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }

        button {
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="controls">
        <button id="zoom-in-btn">Zoom In (+)</button>
        <button id="zoom-out-btn">Zoom Out (-)</button>
        <button id="reset-zoom-btn">Reset Zoom (100%)</button>
    </div>
    <div id="workspace-container"></div>

    <script type="module" src="./usage.js"></script>

</body>

</html>
